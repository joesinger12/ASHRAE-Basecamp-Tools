[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashrae-basecamp"
version = "0.1.0"
description = "Small Python tools for ASHRAE work on the Basecamp API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "basecamp-sdk",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ashrae-bc = "ashrae_basecamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
